[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diarize-gui"
version = "0.1.0"
description = "Simple Tkinter GUI for WhisperX transcription + diarization with recording on macOS (and others)."
authors = [
  { name = "Rama Vasudevan" },
]
readme = "README.MD"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "whisperx",
  "openai-whisper; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-whisper; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "torch",
  "torchaudio",
  "sounddevice",
  "soundfile",
  "pyannote.audio",
  "pyperclip",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
]

[project.urls]
Homepage = "https://example.com/diarize-gui"
Repository = "https://example.com/diarize-gui.git"

[project.scripts]
diarize-gui = "diarize_gui.gui:main"
diarize-server = "diarize_gui.api:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
