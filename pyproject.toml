[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diarize-gui"
version = "0.2.0"
description = "Desktop language-learning assistant for transcription, diarization, longitudinal metrics, and local AI feedback."
authors = [
  { name = "Rama Vasudevan" },
]
readme = "README.MD"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "whisperx",
  "openai-whisper; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "mlx-whisper; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "torch>=2.8,<2.9",
  "torchaudio>=2.8,<2.9",
  "torchvision>=0.23,<0.24",
  "numpy>=2.0.2,<2.1.0",
  "pandas>=2.2.3,<2.3.0",
  "sounddevice",
  "soundfile",
  "customtkinter",
  "pillow",
  "pyannote.audio<4",
  "huggingface-hub>=0.34.0,<1.0",
  "pyperclip",
  "requests",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
]

[project.urls]
Homepage = "https://github.com/ramav87/whisperx_diarize_gui"
Repository = "https://github.com/ramav87/whisperx_diarize_gui.git"

[project.scripts]
diarize-gui = "diarize_gui.gui:main"
diarize-server = "diarize_gui.api:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
